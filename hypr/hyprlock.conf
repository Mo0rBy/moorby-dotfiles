general {
    ignore_empty_input = true
    no_fade_in = false
    disable_loading_bar = false
}

background {
    path = ~/Pictures/wallpapers/tokyo-night-theme/cosmicrobotretro_upscayl_2x_digital-art-4x.png
    blur_passes = 3
    contrast = 0.8976
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

input-field {
    size = 170, 45
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(0,0,0,0)
    inner_color = rgba(100,114,125,0.4)
    font_color = rgb(200,200,200)
    font_family = SF Pro Text Semibold
    placeholder_text = <span>Password</span>
    hide_input = false
    position = 0, -425
    halign = center
    valign = center
}

# Time
label {
    text = cmd[update:1000] echo "<span>$(date +"%H:%M")</span>"
    color = rgba(216,222,233,0.70)
    font_size = 85
    font_family = SF Pro Text Semibold
    position = 0, 310
    halign = center
    valign = center
}

# Date
label {
    text = cmd[update:1000] echo "<span>$(date +"%A, %B %d")</span>"
    color = rgba(216,222,233,0.70)
    font_size = 30
    font_family = SF Pro Text Semibold
    position = 0, 400
    halign = center
    valign = center
}
